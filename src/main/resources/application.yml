spring:
  application.name: metacloth-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metacloth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate:
        format_sql:true
      jdbc.time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info

metacloth:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security.jwt.secret: ${JWT_SECRET:change-this-development-secret-to-a-minimum-32-byte-value}
  security.jwt.expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  google:
    client-id: ${GOOGLE_CLIENT_ID:108269346331-ph5dsulur12el5qrf2j3v2tvv376b5fv.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET: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}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    frontend-callback-url: ${GOOGLE_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/google/callback}
    scopes: ${GOOGLE_OAUTH_SCOPES:openid,email,profile,https://www.googleapis.com/auth/gmail.readonly}
    token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:pxNH/CzgXPRMofVfa9RHk/80PNc+Glb2T+dYb1moGj0=}
  otp.length: ${OTP_LENGTH:6}
  otp.expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  otp.resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  otp.max-attempts: ${OTP_MAX_ATTEMPTS:5}
